# Прежний адрес сервера после переезда на свой сервер (2.9.0): только пересылает запросы (index.js).
# Тот же Worker kae-zapis-api, что раньше, но без базы и без расписания — расписание теперь на своём сервере.
# База D1 kae-zapis остановилась в минуту переезда (01.10.2026, 23:49 по Алматы): новые данные — только на своём
# сервере. Вернуть прежний сервер на Cloudflare можно только вместе с данными: сначала перенести базу своего
# сервера в D1, потом wrangler deploy из папки backend. Иначе всё, что записано после переезда, пропадёт.
name = "kae-zapis-api"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
TARGET = "https://beautybook.kz"

[triggers]
crons = []
