# Сервер Beautybook (до 2.4.0 — Nailapp). С 2.9.0 (01.10.2026) он работает на своём сервере beautybook.kz
# (backend/node, выкладка — bash backend/deploy/deploy.sh), а Worker kae-zapis-api на Cloudflare — пересылка
# из backend/proxy. Этот файл — для проверки на компьютере (wrangler dev). wrangler deploy отсюда НЕ запускать:
# он заменит пересылку прежним сервером на базе D1, а в D1 нет ничего, что записано после переезда.
name = "kae-zapis-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Каждый день в 04:00 UTC = 09:00 по Алматы — сводка по подпискам администратору; каждые 5 минут —
# напоминания мастерам о записях (2.8.0). Обработчик — scheduled в src/index.js.
[triggers]
crons = ["0 4 * * *", "*/5 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "kae-zapis"
database_id = "dc66615c-c584-463e-96f8-cbbcf5ab4eca"
migrations_dir = "migrations"
