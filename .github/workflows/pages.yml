# Выкладывает сайт — папку frontend/ — на GitHub Pages после каждого push в main,
# если в ней что-то изменилось. Адрес не меняется: https://komron4111.github.io/kae-zapis/
# Сервер (backend/) выкладывается отдельно: wrangler deploy.
name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v5
