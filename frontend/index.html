<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nailapp</title>
  <meta name="description" content="Записи клиентов, прайс и финансы мастера маникюра.">
  <meta name="theme-color" content="#B8456F" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#4A2233" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nailapp">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="appbar" id="appbar"><h1>Nailapp</h1></header>
  <main id="view"></main>
  <button class="fab" id="fab" data-act="new-appt" aria-label="Новая запись" hidden></button>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Фото результата" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
</body>
</html>
