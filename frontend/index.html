<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Политика безопасности: скрипты — только файлы сайта, запросы — только к своему серверу.
       Сменился адрес сервера (config.js) — поменяйте его и здесь, во всех трёх страницах. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self' https://kae-zapis-api.kae-zapis.workers.dev http://127.0.0.1:8787 http://localhost:8787; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beautybook</title>
  <meta name="description" content="Записи клиентов, прайс и финансы мастера красоты.">
  <meta name="theme-color" content="#933C8B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#3C1C39" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beautybook">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="errors.js" data-source="app"></script>
  <script src="theme-init.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="appbar" id="appbar">
    <h1 class="brand"><img src="icons/logo-neon.png" alt="" width="42" height="42">Beautybook</h1>
    <div class="appbar-actions" id="appbar-actions"></div>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" data-act="new-appt" aria-label="Новая запись" hidden></button>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Фото результата" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
</body>
</html>
